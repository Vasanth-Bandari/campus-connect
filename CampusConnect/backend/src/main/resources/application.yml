spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:campusconnect}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:5}MB
      max-request-size: ${MAX_FILE_SIZE_MB:5}MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

campusconnect:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProduction64CharactersLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads/resumes}
  admin:
    email: ${ADMIN_EMAIL:admin@campusconnect.edu}
    password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.campusconnect: INFO
    org.springframework.security: WARN
