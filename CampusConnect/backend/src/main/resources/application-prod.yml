spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

campusconnect:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${FRONTEND_URL}
  admin:
    email: ${ADMIN_EMAIL:admin@campusconnect.edu}
    password: ${ADMIN_PASSWORD:Admin@123}
  upload:
    dir: ${UPLOAD_DIR:uploads/resumes}

logging:
  level:
    com.campusconnect: WARN
    org.springframework: WARN
